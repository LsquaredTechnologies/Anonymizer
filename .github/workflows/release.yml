name: Create Release

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-rust:
    uses: ./.github/workflows/build-rust.yml

  build-csharp:
    needs: [build-rust]
    uses: ./.github/workflows/build-csharp.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    name: Publish Release
    needs: [build-csharp]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts (Linux)
        uses: actions/download-artifact@v8
        with:
          name: setup-linux
          path: artifacts

      - name: Download artifacts (Windows)
        uses: actions/download-artifact@v8
        with:
          name: setup-win
          path: artifacts

      - name: Check artifacts (ONNX Models)
        id: latest-models-run
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'download-models.yml',
              status: 'completed',
              per_page: 50,
            });
            let selectedRunId = null;
            for (const run of runs) {
              if (run.conclusion !== 'success') {
                continue;
              }
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const hasModels = artifacts.data.artifacts.some(
                artifact => artifact.name === 'onnx-models' && !artifact.expired,
              );
              if (hasModels) {
                selectedRunId = run.id;
                break;
              }
            }
            if (!selectedRunId) {
              core.setFailed('No successful run with non-expired onnx-models artifact was found for download-models.yml.');
              return;
            }
            core.info(`Using onnx-models artifact from run ${selectedRunId}`);
            core.setOutput('run_id', selectedRunId.toString());

      - name: Download model archives artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest-models-run.outputs.run_id }}
          name: onnx-models
          path: artifacts

      - name: Copy install scripts
        run: |
          cp ./scripts/install.* ./artifacts/

      - name: Changelog
        id: changelog
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --latest --tag ${{ github.event.inputs.tag || github.ref_name }} -o artifacts/CHANGELOG.md
        env:
          GIT_CLIFF_OUTPUT: content

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          body_path: artifacts/CHANGELOG.md
          files: |
            artifacts/CHANGELOG.md
            artifacts/*_model.zip
            artifacts/install.*
            artifacts/setup*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
